name: arkas_sd_zaha
description: "Aplikasi Pelaporan ARKAS SD Zainul Hasan Genggong"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  pdf: ^3.10.4
  printing: ^5.11.1
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/logo_sekolah.png"
  windows:
    generate: true
    image_path: "assets/logo_sekolah.png"
    icon_size: 256