name: arkas_sd_zaha
description: "Aplikasi Pelaporan ARKAS SD Zainul Hasan Genggong"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0            # Untuk komunikasi dengan Google Apps Script API
  intl: ^0.19.0           # Untuk format tanggal dan mata uang Rupiah
  pdf: ^3.10.4            # Untuk generate laporan format PDF (K7, K7a, K7b, dll)
  printing: ^5.11.1       # Untuk preview dan cetak PDF langsung di Windows

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true